# Los colores salen de src/estilo.py; tests/test_estilo.py comprueba que coinciden.
[theme]
base = "light"
primaryColor = "#00818d"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#0b0b0b"
font = "sans serif"
headingFont = "Fraunces"
# h3 más chico: los títulos con la conclusión son frases largas y a 375 px ocupan 4 líneas con el tamaño por defecto
headingFontSizes = ["2.5rem", "2rem", "1.5rem", "1.25rem", "1.125rem", "1rem"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
paddingTop = "1rem"
greenColor = "#527a00"
redColor = "#c93636"

# Fraunces (SIL OFL 1.1, Google Fonts), subconjunto latino, servida desde static/fonts/
[[theme.fontFaces]]
family = "Fraunces"
url = "app/static/fonts/Fraunces-600.woff2"
weight = 600
style = "normal"

[server]
enableStaticServing = true

[client]
toolbarMode = "minimal"
